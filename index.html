<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Page</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8;
      --fg: #1a1a1a;
      --accent: #5b5bd6;
      --card-bg: #ffffff;
      --border: #e2e2e6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14141a;
        --fg: #ececf1;
        --accent: #8b8bf0;
        --card-bg: #1e1e26;
        --border: #2c2c36;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 3rem;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
      color: var(--accent);
    }

    p {
      margin: 0;
      line-height: 1.5;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sample Page</h1>
    <p>This is a sample page for the rbarepo project.</p>
    <p style="margin-top: 1rem;"><a href="components.html" style="color: var(--accent);">View component library →</a></p>
    <p style="margin-top: 0.5rem;"><a href="yearly-summary.html" style="color: var(--accent);">View Zero Waste yearly summary →</a></p>
  </div>
</body>
</html>
